name: Build PWA APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install PWABuilder CLI
        run: npm install -g @pwabuilder/pwapush

      - name: Generate Android Package
        run: |
          npx @pwabuilder/pwapush generate --manifest https://aliathar535-coder.github.io/Gadipro/manifest.json --platform android
          
